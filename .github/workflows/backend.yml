name: Backend foundation
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra_local
          POSTGRES_DB: astra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U astra -d astra_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgresql+psycopg://astra:astra_local@localhost:5432/astra_test
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock
      - run: pip install --no-deps -e backend
      - run: ruff check backend
      - run: black --check backend
      - run: mypy --config-file backend/pyproject.toml backend/app
      - run: pytest backend/tests -q
