[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-cadastre"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "SQLAlchemy>=2.0.36,<2.1",
  "GeoAlchemy2>=0.17,<1", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "shapely>=2.0.6,<3", "pyproj>=3.7,<4", "numpy>=2.2,<3",
  "celery[redis]>=5.5,<6", "redis>=5.2,<7", "PyJWT[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1", "boto3>=1.36,<2", "httpx>=0.28,<1",
  "prometheus-client>=0.21,<1", "rasterio>=1.4,<2",
  "opencv-python-headless>=4.10,<5", "mapbox-earcut>=1.0,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1", "black>=25,<27", "mypy>=1.15,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires dedicated PostGIS test database and Redis"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["app"]
