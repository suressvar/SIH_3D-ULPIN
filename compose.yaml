name: astra-sih
services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: astra
      POSTGRES_PASSWORD: astra_local
      POSTGRES_DB: astra
    ports: ["127.0.0.1:54329:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/10-astra.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra -d astra"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:63799:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://astra_app:astra_app_local@db:5432/astra
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /data/objects
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["objects:/data/objects"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://astra_app:astra_app_local@db:5432/astra
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /data/objects
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    volumes: ["objects:/data/objects"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  scheduler:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://astra_app:astra_app_local@db:5432/astra
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  pgdata:
  redisdata:
  objects:
